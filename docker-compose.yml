services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: polymnia
      POSTGRES_USER: ${DB_USERNAME:-polymnia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polymnia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U ${DB_USERNAME:-polymnia} -d polymnia"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/polymnia
      DB_USERNAME: ${DB_USERNAME:-polymnia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      
volumes:
  polymnia_data: